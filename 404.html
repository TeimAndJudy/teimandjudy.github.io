<script>
(function(){
  var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
  if (path && path !== '404.html' && path !== 'index.html') {
    var guest;
    try { guest = decodeURIComponent(path.replace(/\+/g, ' ')); }
    catch (e) { guest = path.replace(/\+/g, ' '); }
    window.location.replace('/?guest=' + encodeURIComponent(guest));
    return;
  }
  window.location.replace('/');
})();
</script>
