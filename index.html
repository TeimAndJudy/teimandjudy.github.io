<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teim & Judy Wedding</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#681017;
    overflow-x:hidden;
}

/* =========================
   COVER
========================= */

#cover{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    padding:35px 18px;

    background:
    radial-gradient(
        circle at center,
        #8b1b23 0%,
        #711219 55%,
        #50090e 100%
    );

    overflow:hidden;
}

/* FLOATING HEARTS */

.float-heart{
    position:absolute;
    color:#e8bcb3;
    opacity:.45;
    font-size:18px;
    animation:floatHeart 7s ease-in-out infinite;
}

.h1{left:10%;top:12%;}
.h2{right:12%;top:16%;animation-delay:1s;}
.h3{right:4%;top:38%;animation-delay:2s;}
.h4{left:7%;bottom:20%;animation-delay:3s;}
.h5{right:13%;bottom:10%;animation-delay:4s;}
.h6{left:48%;bottom:6%;animation-delay:2s;}

@keyframes floatHeart{

    0%,100%{
        transform:translateY(0) rotate(-5deg);
        opacity:.3;
    }

    50%{
        transform:translateY(-28px) rotate(10deg);
        opacity:.7;
    }
}


/* =========================
   CARD
========================= */

.card{

    width:min(680px,92vw);
    min-height:850px;

    background:#fff9f0;

    border-radius:13px;

    box-shadow:
    0 22px 55px rgba(45,0,0,.42);

    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    padding:52px 30px 48px;

    overflow:hidden;

    animation:appear 1s ease;
}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(25px) scale(.985);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   FLOWERS
========================= */

.floral{
    position:absolute;
    width:180px;
    height:auto;
    pointer-events:none;
}

.floral-top{
    left:-12px;
    top:-5px;
}

.floral-bottom{
    right:-12px;
    bottom:-8px;
    transform:rotate(180deg);
}


/* =========================
   HEART
========================= */

.heart-circle{

    width:82px;
    height:82px;

    border-radius:50%;

    background:
    linear-gradient(
        145deg,
        #7b1119,
        #50080d
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff7ee;

    font-size:34px;

    box-shadow:
    0 10px 25px rgba(90,0,0,.3);

    margin-top:5px;
    margin-bottom:32px;
}


/* =========================
   NAMES
========================= */

.names{

    font-family:'Great Vibes',cursive;

    color:#671319;

    font-size:64px;

    line-height:.92;

    font-weight:400;
}

.amp{

    font-family:'Cormorant Garamond',serif;

    font-size:34px;

    color:#8b5052;

    margin:9px 0;
}


/* =========================
   DIVIDER
========================= */

.divider{

    display:flex;
    align-items:center;
    justify-content:center;

    gap:14px;

    margin:28px 0 19px;

    color:#9c6668;
}

.divider::before,
.divider::after{

    content:"";

    width:105px;
    height:1px;
}

.divider::before{

    background:
    linear-gradient(
        to right,
        transparent,
        #9c6668
    );
}

.divider::after{

    background:
    linear-gradient(
        to left,
        transparent,
        #9c6668
    );
}

.divider span{
    font-size:17px;
}


/* =========================
   DATE
========================= */

.date{

    font-family:'Cormorant Garamond',serif;

    font-size:28px;

    letter-spacing:4px;

    color:#976366;

    font-weight:500;

    margin-bottom:40px;
}


/* =========================
   ARABIC TITLE
========================= */

.arabic-title{

    font-family:'Noto Naskh Arabic',serif;

    direction:rtl;

    color:#8e5d60;

    font-size:28px;

    font-weight:600;

    margin-bottom:15px;
}


/* =========================
   GUEST NAME
========================= */

.guest-box{

    width:min(470px,80%);

    padding:14px 25px;

    background:#f1e2db;

    border-radius:19px;

    color:#69191e;

    font-family:
    'Noto Naskh Arabic',
    'Cormorant Garamond',
    serif;

    font-size:33px;

    font-weight:600;

    margin-bottom:20px;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.6);
}


/* =========================
   ARABIC TEXT
========================= */

.arabic-text{

    font-family:'Noto Naskh Arabic',serif;

    direction:rtl;

    color:#895256;

    font-size:28px;

    line-height:1.7;

    margin-bottom:32px;
}


/* =========================
   OPEN BUTTON
========================= */

.open-btn{

    width:205px;
    min-height:86px;

    border:none;

    border-radius:44px;

    background:
    linear-gradient(
        110deg,
        #681016 0%,
        #811720 48%,
        #5c0c12 100%
    );

    color:#fff8ef;

    font-family:'Cormorant Garamond',serif;

    font-size:25px;

    letter-spacing:4px;

    cursor:pointer;

    box-shadow:
    0 10px 25px rgba(75,0,0,.28);

    transition:
    transform .3s,
    box-shadow .3s;
}

.open-btn:hover{

    transform:
    translateY(-3px)
    scale(1.03);

    box-shadow:
    0 14px 30px rgba(75,0,0,.32);
}

.arrow{

    display:block;

    font-size:28px;

    line-height:.8;

    margin-top:5px;

    letter-spacing:0;
}


/* =========================
   AFTER OPEN
========================= */

#invitation{

    display:none;

    min-height:100vh;

    background:#fffaf3;

    color:#671319;

    text-align:center;

    padding:90px 20px;

    animation:appear .9s ease;
}

#invitation h1{

    font-family:'Great Vibes',cursive;

    font-size:68px;

    font-weight:400;

    margin-bottom:28px;
}

#invitation p{

    font-family:'Noto Naskh Arabic',serif;

    direction:rtl;

    font-size:26px;

    line-height:1.7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #cover{
        padding:28px 12px;
    }

    .card{

        width:94vw;

        min-height:760px;

        padding:45px 18px 40px;
    }

    .floral{
        width:135px;
    }

    .heart-circle{

        width:69px;
        height:69px;

        font-size:28px;

        margin-bottom:28px;
    }

    .names{
        font-size:53px;
    }

    .amp{
        font-size:28px;
    }

    .divider{
        margin:23px 0 16px;
    }

    .divider::before,
    .divider::after{
        width:68px;
    }

    .date{

        font-size:21px;

        letter-spacing:2.5px;

        margin-bottom:31px;
    }

    .arabic-title{

        font-size:24px;

        margin-bottom:12px;
    }

    .guest-box{

        width:82%;

        padding:12px 15px;

        font-size:27px;

        margin-bottom:17px;
    }

    .arabic-text{

        font-size:24px;

        margin-bottom:29px;
    }

    .open-btn{

        width:170px;

        min-height:73px;

        font-size:22px;
    }

}


/* Arabic invitation cards — cover styles remain unchanged. */
#invitation .love-card,
#invitation .reception-card{
    width:100%;
    max-width:680px;
    margin:0 auto 48px;
    padding:48px 24px;
    border-radius:24px;

#invitation .love-card h2,
#invitation .reception-card h2{
    font-size:clamp(1.6rem,6vw,2.5rem);
    font-weight:700;
    line-height:1.7;
    margin-bottom:22px;
}
#invitation .love-card p{
    max-width:470px;
    margin:0 auto;
    color:#f2d9cd;
    font-size:clamp(1.1rem,4.5vw,1.55rem);
    line-height:2;
}
#invitation .couple-arabic{
    display:grid;
    justify-items:center;
    gap:8px;
    margin-top:38px;
}
#invitation .arabic-name{
    font-family:'Aref Ruqaa','Noto Naskh Arabic',serif;
    font-size:clamp(2.4rem,10vw,4.8rem);
    font-weight:700;
    line-height:1.8;
    max-width:100%;
    padding:4px 0;
    text-shadow:0 3px 12px rgba(30,0,0,.12);
}
#invitation .name-amp{
    font-family:'Great Vibes',cursive;
    font-size:clamp(2.2rem,8vw,3.8rem);
    line-height:1.3;
    color:#dfb9a6;
}
#invitation .names-revealed .arabic-name{
    animation:arabicNameReveal 1.2s ease both;
}
#invitation .names-revealed .arabic-name:last-child{
    animation-delay:.22s;
}
@keyframes arabicNameReveal{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
}
@media(prefers-reduced-motion:reduce){
    #invitation .names-revealed .arabic-name{animation:none;}
}

<script>

/* =========================
   GUEST NAME FROM LINK
========================= */

const params =
new URLSearchParams(window.location.search);

const guest =
params.get("guest");

if(guest){

    document
    .getElementById("guestName")
    .textContent = guest;

}


/* =========================
   OPEN
========================= */

function openInvitation(){

    document
    .getElementById("cover")
    .style.display="none";

    document
    .getElementById("invitation")
    .style.display="block";

    window.scrollTo(0,0);

}


/* Reveal whole Arabic names together to preserve connected lettering. */
if ('IntersectionObserver' in window) {
    const namesObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            if (entry.isIntersecting) {
                entry.target.classList.add('names-revealed');
                namesObserver.unobserve(entry.target);
            }
        });
    }, { threshold:0.2 });
    document.querySelectorAll('.couple-arabic').forEach(function(el) {
        namesObserver.observe(el);
    });
}

</script>
