name: Patch RSVP glass style

on:
  push:
    paths:
      - '.github/workflows/patch-rsvp-glass-note.yml'

permissions:
  contents: write

jobs:
  patch-rsvp-glass-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RSVP glass style and kids note
        run: python patch_rsvp_glass_note.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make RSVP card translucent and add kids note"
          git push origin HEAD:main
