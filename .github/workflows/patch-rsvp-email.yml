name: Patch RSVP email

on:
  push:
    paths:
      - '.github/workflows/patch-rsvp-email.yml'

permissions:
  contents: write

jobs:
  patch-rsvp-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update RSVP target email
        run: python patch_rsvp_email.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Send RSVP responses to connected Gmail"
          git push origin HEAD:main
