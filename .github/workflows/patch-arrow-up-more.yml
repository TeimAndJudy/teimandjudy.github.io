name: Patch arrow alignment more

on:
  push:
    paths:
      - '.github/workflows/patch-arrow-up-more.yml'

permissions:
  contents: write

jobs:
  patch-arrow-up-more:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move cover arrow further upward
        run: python patch_arrow_up_more.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move invitation arrow further upward"
          git push origin HEAD:main
