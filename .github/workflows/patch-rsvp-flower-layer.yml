name: Patch RSVP flower layer
on:
  push:
    paths:
      - '.github/workflows/patch-rsvp-flower-layer.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python patch_rsvp_flower_layer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Place RSVP flower above glass panel"
          git push origin HEAD:main
