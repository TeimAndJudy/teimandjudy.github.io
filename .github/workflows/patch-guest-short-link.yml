name: Patch guest short link

on:
  push:
    paths:
      - '.github/workflows/patch-guest-short-link.yml'

permissions:
  contents: write

jobs:
  patch-guest-short-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply guest short link update
        run: python patch_guest_short_link.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Allow guest name directly in invitation URL"
          git push origin HEAD:main
