name: Patch venue card

on:
  push:
    paths:
      - '.github/workflows/patch-venue-card.yml'

permissions:
  contents: write

jobs:
  patch-venue-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply venue card update
        run: python patch_venue_card.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Quattro Hotel map card above RSVP"
          git push origin HEAD:main
