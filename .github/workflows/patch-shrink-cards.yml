name: Patch shrink cards

on:
  push:
    paths:
      - '.github/workflows/patch-shrink-cards.yml'

permissions:
  contents: write

jobs:
  patch-shrink-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Slightly shrink invitation cards
        run: python patch_shrink_cards.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Slightly shrink invitation cards"
          git push origin HEAD:main
