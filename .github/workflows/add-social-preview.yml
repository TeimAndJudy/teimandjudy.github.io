name: Add social preview metadata

on:
  push:
    paths:
      - '.github/workflows/add-social-preview.yml'

permissions:
  contents: write

jobs:
  update-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Open Graph title
        shell: python
        run: |
          from pathlib import Path

          new_title = "Teim & Judy’s Wedding ❤️"
          for filename in ('index.html', '404.html'):
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              import re
              text = re.sub(r'<title>.*?</title>', f'<title>{new_title}</title>', text, count=1)
              text = re.sub(r'<meta property="og:title" content="[^"]*">', f'<meta property="og:title" content="{new_title}">', text, count=1)
              text = re.sub(r'<meta property="og:image:alt" content="[^"]*">', f'<meta property="og:image:alt" content="{new_title}">', text, count=1)
              text = re.sub(r'<meta name="twitter:title" content="[^"]*">', f'<meta name="twitter:title" content="{new_title}">', text, count=1)
              p.write_text(text, encoding='utf-8')

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html
          git commit -m "Update wedding preview title"
          git push
