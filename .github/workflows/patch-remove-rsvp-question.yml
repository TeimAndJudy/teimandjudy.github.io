name: Remove RSVP question

on:
  push:
    paths:
      - '.github/workflows/patch-remove-rsvp-question.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove RSVP question
        run: python patch_remove_rsvp_question.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove RSVP attendance question"
          git push origin HEAD:main
