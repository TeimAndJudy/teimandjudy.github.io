name: Patch CSS arrow center

on:
  push:
    paths:
      - '.github/workflows/patch-arrow-css.yml'

permissions:
  contents: write

jobs:
  patch-arrow-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace glyph with centered CSS arrow
        run: python patch_arrow_css.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Center invitation arrow precisely"
          git push origin HEAD:main
