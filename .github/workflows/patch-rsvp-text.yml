name: Patch RSVP text

on:
  push:
    paths:
      - '.github/workflows/patch-rsvp-text.yml'

permissions:
  contents: write

jobs:
  patch-rsvp-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RSVP text update
        run: python patch_rsvp_text.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Shorten RSVP invitation text"
          git push origin HEAD:main
