name: Patch remove old arrow

on:
  push:
    paths:
      - '.github/workflows/patch-remove-old-arrow.yml'

permissions:
  contents: write

jobs:
  patch-remove-old-arrow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove old arrow glyph
        run: python patch_remove_old_arrow.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove old invitation arrow glyph"
          git push origin HEAD:main
