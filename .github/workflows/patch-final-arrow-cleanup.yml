name: Patch final arrow cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-final-arrow-cleanup.yml'

permissions:
  contents: write

jobs:
  patch-final-arrow-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clean and center cover arrow
        run: python patch_final_arrow_cleanup.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix invitation arrow styling"
          git push origin HEAD:main
