name: Patch RSVP instant choice

on:
  push:
    paths:
      - '.github/workflows/patch-rsvp-instant-choice.yml'

permissions:
  contents: write

jobs:
  patch-rsvp-instant-choice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply RSVP shell and instant submit
        run: python patch_rsvp_instant_choice.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restyle RSVP and submit choices instantly"
          git push origin HEAD:main
