name: Patch photo motion

on:
  push:
    paths:
      - '.github/workflows/patch-photo-motion.yml'

permissions:
  contents: write

jobs:
  patch-photo-motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply photo motion update
        run: python patch_photo_motion.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep forever title on one line and animate photo frame"
          git push origin HEAD:main
